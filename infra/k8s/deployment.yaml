apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-cost-anomaly-worker
  labels:
    app.kubernetes.io/name: cloud-cost-anomaly-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-cost-anomaly-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-cost-anomaly-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cloud-cost-anomaly-worker
      containers:
        - name: worker
          image: ghcr.io/contoso/cloud-cost-anomaly-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AnomalyWorker__BillingScope
              valueFrom:
                secretKeyRef:
                  name: cloud-cost-anomaly
                  key: billing-scope
            - name: AnomalyWorker__AdxClusterUri
              valueFrom:
                configMapKeyRef:
                  name: cloud-cost-anomaly
                  key: adx-cluster-uri
            - name: AnomalyWorker__AdxDatabase
              value: CloudCost
            - name: AnomalyWorker__AlertMinimumCostDelta
              value: "100"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ "ALL" ]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-cost-anomaly-worker
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_IDENTITY_CLIENT_ID}"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloud-cost-anomaly-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloud-cost-anomaly-worker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
